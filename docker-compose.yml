version: '3.8'

services:
  # c) Servicio de servidor de aplicación (Python / Flask)
  web:
    build: ./src
    container_name: app_web
    ports:
      - "5000:5000"
    volumes:
      - ./src:/app
    depends_on:
      - db
    environment:
      - PYTHONUNBUFFERED=1

  # d) Servicio de base de datos MySQL
  db:
    image: mysql:8.0
    container_name: app_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: test_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: